[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlpcli"
version = "0.1.0"
description = "Interactive yt-dlp downloader for macOS with Rich progress, format selection, config, parallel downloads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich>=14.3.4,<15",
  # Richの間接依存で、既知の脆弱性を修正した版を要求する。
  "pygments>=2.20.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
]

[project.scripts]
ytdlpcli = "ytdlpcli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
